name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: "Plugin unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run plugin unit tests
        run: |
          python3 -m pytest tests/ -q

  integration:
    name: "Seam gate (with fork)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4.2.2

      - name: Checkout fork (sibling inside workspace)
        uses: actions/checkout@v4.2.2
        with:
          repository: nhecker/wharenui-hermes-agent
          ref: wharenui-integration
          path: ./wharenui-hermes-agent

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .
          pip install -e ./wharenui-hermes-agent[test,dev,web,acp]
          pip install anthropic==0.87.0 mcp==1.26.0 agent-client-protocol==0.9.0 python-multipart==0.0.27

      - name: Run seam gate
        env:
          WHARENUI_PLUGIN_DIR: ${{ github.workspace }}
        working-directory: ./wharenui-hermes-agent
        run: |
          python3 .github/scripts/run_tests.py --selector tests/run_agent -m "wharenui_seam" --min-collected 78 --mode serial
  stock-hermes:
    name: "Stock Hermes open-notebook (pinned c2e45b555)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4.2.2

      - name: Checkout stock Hermes (pinned full SHA)
        uses: actions/checkout@v4.2.2
        with:
          repository: nousresearch/hermes-agent
          ref: c2e45b555f8a4e78e8dacbeb965bbf3fcf5d709a
          path: ./stock-hermes

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run stock-hermes test
        env:
          STOCK_HERMES_DIR: ${{ github.workspace }}/stock-hermes
        run: |
          python3 -m pytest tests/test_open_notebook.py::test_open_notebook_against_real_stock_hermes -v
