[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wharenui-hermes-agent-plugin"
version = "0.1.0"
description = "Wharenui journal plugin for Hermes Agent"
requires-python = ">=3.11"
authors = [{ name = "Rook" }]
dependencies = [
    "cryptography",
]

[project.entry-points."hermes_agent.plugins"]
wharenui = "wharenui_plugin"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["wharenui_plugin"]
[tool.pytest.ini_options]
addopts = "--ignore=run_test.py"
